name: 🎬 Generate & Upload Multi-Language Shorts

on:
  schedule:
    # 04:00 UTC = 09:30 IST, 13:00 UTC = 18:30 IST (6:30 PM) — runs twice daily.
    # NOTE: GitHub runs cron on a BEST-EFFORT basis and often delays scheduled jobs
    # (minutes to a few hours), especially at round times when the shared free queue
    # is congested — exact timing is NOT guaranteed. To reduce drift, change the
    # minute to an odd value, e.g. '7 4,13 * * *' (09:37 / 18:37 IST). For exact
    # timing, trigger via an external scheduler hitting the workflow_dispatch API.
    - cron: '0 4,13 * * *'
  workflow_dispatch:
    inputs:
      num_scenes:
        description: 'Scenes per episode (10 = full ~70s story; lower = cheaper, e.g. 2 for a smoke test)'
        required: false
        default: '10'
      image_provider:
        description: 'Image backend: cf-first | free | auto | cloudflare | gemini | pollinations | hf'
        required: false
        default: 'cf-first'
      skip_upload:
        description: 'Render only — do not upload to YouTube or persist state'
        type: boolean
        required: false
        default: false
      use_ai_video:
        description: 'Animate key scenes into real motion clips (HF I2V); off = Ken Burns only'
        type: boolean
        required: false
        default: false
      i2v_scene_indices:
        description: 'Which scenes to animate (1-based): e.g. "1,4,8", "all", or "" to disable'
        required: false
        default: '1,4,8'

permissions:
  contents: write

concurrency:
  group: yt-shorts-production-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    # Base pipeline needs ~15-18 min; free HF ZeroGPU I2V adds queue/generation time for the
    # animated scenes, so allow 60 min so a slow Space never kills a mid-flight render.
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies & Indic fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-noto-extra
          pip install -r requirements.txt

      - name: ✅ Pre-flight repository quality gate
        run: |
          python -m py_compile main_pipeline.py video_animator.py upload_to_youtube.py upload_to_meta.py auth_setup.py test_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path

          bank = json.loads(Path("story_bank.json").read_text(encoding="utf-8"))
          state = json.loads(Path("story_state.json").read_text(encoding="utf-8"))
          ids = [story.get("id") for story in bank]
          assert len(ids) == len(set(ids)), "story_bank.json has duplicate story IDs"
          assert state.get("current_story_id") in ids, "current story is missing from story_bank.json"
          assert all(story.get("core_plot") for story in bank), "every story needs a core_plot"
          print("Pre-flight quality gate passed.")
          PY

      - name: 🔑 Decode YouTube OAuth tokens
        env:
          YT_TOKEN_KN: ${{ secrets.YT_TOKEN_KN }}
          YT_TOKEN_TE: ${{ secrets.YT_TOKEN_TE }}
          YT_TOKEN_HI: ${{ secrets.YT_TOKEN_HI }}
        run: |
          set -euo pipefail
          echo "$YT_TOKEN_KN" | base64 -d > token_kn.json
          echo "$YT_TOKEN_TE" | base64 -d > token_te.json
          echo "$YT_TOKEN_HI" | base64 -d > token_hi.json

      - name: 🎬 Generate & Upload Shorts
        env:
          # Stream logs live: without this, Python block-buffers stdout in CI (no TTY), so the
          # live Actions log sits silent for minutes then dumps a burst — making a healthy run
          # look frozen/stuck. Unbuffered output shows real-time progress.
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Primary FREE image source: Cloudflare Workers AI FLUX (10k neurons/day, no card).
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Optional image fallbacks — pipeline runs without them.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # Facebook + Instagram Reels cross-posting (optional; skipped if unset).
          META_CREDENTIALS_JSON: ${{ secrets.META_CREDENTIALS_JSON }}
          # Manual-run overrides; scheduled runs fall back to the defaults.
          NUM_SCENES: ${{ github.event.inputs.num_scenes || '10' }}
          # Default to FREE images (Pollinations -> HF FLUX -> paid Gemini last resort).
          # Override per-run via the manual input, or repo-wide via an Actions variable
          # named IMAGE_PROVIDER (Settings -> Secrets and variables -> Actions -> Variables).
          IMAGE_PROVIDER: ${{ github.event.inputs.image_provider || vars.IMAGE_PROVIDER || 'cf-first' }}
          # Image-to-Video (free HF ZeroGPU). Toggle repo-wide via Actions variables
          # USE_AI_VIDEO (true/false) and I2V_SCENE_INDICES ("1,4,8" | "all" | "").
          USE_AI_VIDEO: ${{ github.event.inputs.use_ai_video || vars.USE_AI_VIDEO || 'false' }}
          I2V_SCENE_INDICES: ${{ github.event.inputs.i2v_scene_indices || vars.I2V_SCENE_INDICES || '1,4,8' }}
        run: |
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            echo "🧪 Test mode: rendering only (no upload, no state changes)."
            python -u -m main_pipeline --skip-upload --dry-run
          else
            python -u -m main_pipeline
          fi

      - name: 📤 Upload rendered preview (manual runs only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: shorts-preview
          path: |
            output_build/**/final_*.mp4
            output_build/**/shared_images/*.jpg
            output_build/**/shared_clips/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: 📝 Commit updated state & vault
        # Skip on manual render-only runs: a pre-flight must never persist/push state.
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story_state.json story_bank.json job_history.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi
          git commit -m "🔄 Auto-update story state & vault [skip ci]"
          # GitHub occasionally 500s on push ("Internal Server Error"); retry with rebase so a
          # transient hiccup never loses a real state advancement (which would re-run an episode).
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed state on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing on latest main and retrying..."
            git pull --rebase origin main || true
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push updated state after 5 attempts."
          exit 1
