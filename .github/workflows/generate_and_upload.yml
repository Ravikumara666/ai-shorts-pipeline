name: 🎬 Generate & Upload Multi-Language Shorts

on:
  schedule:
    # 04:00 UTC = 09:30 IST, 13:00 UTC = 18:30 IST (6:30 PM) — runs twice daily.
    # NOTE: GitHub runs cron on a BEST-EFFORT basis and often delays scheduled jobs
    # (minutes to a few hours), especially at round times when the shared free queue
    # is congested — exact timing is NOT guaranteed. To reduce drift, change the
    # minute to an odd value, e.g. '7 4,13 * * *' (09:37 / 18:37 IST). For exact
    # timing, trigger via an external scheduler hitting the workflow_dispatch API.
    - cron: '0 4,13 * * *'
  workflow_dispatch:
    inputs:
      num_scenes:
        description: 'Scenes per episode (lower = cheaper, e.g. 2 for a smoke test)'
        required: false
        default: '8'
      image_provider:
        description: 'Image backend: free-first | free | auto | gemini | pollinations | hf'
        required: false
        default: 'free-first'
      skip_upload:
        description: 'Render only — do not upload to YouTube or persist state'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: yt-shorts-production-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    # Pipeline needs ~15-18 min (install + 8 images + 3 renders + uploads);
    # 40 leaves headroom so a slow runner/install never kills a mid-flight render.
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies & Indic fonts
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-noto-extra
          pip install -r requirements.txt

      - name: ✅ Pre-flight repository quality gate
        run: |
          python -m py_compile main_pipeline.py upload_to_youtube.py upload_to_meta.py auth_setup.py test_pipeline.py
          python - <<'PY'
          import json
          from pathlib import Path

          bank = json.loads(Path("story_bank.json").read_text(encoding="utf-8"))
          state = json.loads(Path("story_state.json").read_text(encoding="utf-8"))
          ids = [story.get("id") for story in bank]
          assert len(ids) == len(set(ids)), "story_bank.json has duplicate story IDs"
          assert state.get("current_story_id") in ids, "current story is missing from story_bank.json"
          assert all(len(story.get("episode_beats", [])) == 5 for story in bank), "every story requires five beats"
          print("Pre-flight quality gate passed.")
          PY

      - name: 🔑 Decode YouTube OAuth tokens
        env:
          YT_TOKEN_KN: ${{ secrets.YT_TOKEN_KN }}
          YT_TOKEN_TE: ${{ secrets.YT_TOKEN_TE }}
          YT_TOKEN_HI: ${{ secrets.YT_TOKEN_HI }}
        run: |
          set -euo pipefail
          echo "$YT_TOKEN_KN" | base64 -d > token_kn.json
          echo "$YT_TOKEN_TE" | base64 -d > token_te.json
          echo "$YT_TOKEN_HI" | base64 -d > token_hi.json

      - name: 🎬 Generate & Upload Shorts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional image fallbacks — pipeline runs without them (Gemini is primary).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          # Facebook + Instagram Reels cross-posting (optional; skipped if unset).
          META_CREDENTIALS_JSON: ${{ secrets.META_CREDENTIALS_JSON }}
          # Manual-run overrides; scheduled runs fall back to the defaults.
          NUM_SCENES: ${{ github.event.inputs.num_scenes || '8' }}
          # Default to FREE images (Pollinations -> HF FLUX -> paid Gemini last resort).
          # Override per-run via the manual input, or repo-wide via an Actions variable
          # named IMAGE_PROVIDER (Settings -> Secrets and variables -> Actions -> Variables).
          IMAGE_PROVIDER: ${{ github.event.inputs.image_provider || vars.IMAGE_PROVIDER || 'free-first' }}
        run: |
          if [ "${{ github.event.inputs.skip_upload }}" = "true" ]; then
            echo "🧪 Test mode: rendering only (no upload, no state changes)."
            python -m main_pipeline --skip-upload --dry-run
          else
            python -m main_pipeline
          fi

      - name: 📤 Upload rendered preview (manual runs only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: shorts-preview
          path: |
            output_build/**/final_*.mp4
            output_build/**/shared_images/*.jpg
          if-no-files-found: ignore
          retention-days: 7

      - name: 📝 Commit updated state & vault
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add story_state.json story_bank.json job_history.json
          git diff --cached --quiet || git commit -m "🔄 Auto-update story state & vault [skip ci]"
          git push
